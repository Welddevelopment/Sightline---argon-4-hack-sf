<!doctype html><html><head><meta charset="utf-8"><title>render dev viewer</title>
<style>html,body{margin:0;background:#000}canvas{display:block}#hud{position:fixed;left:8px;top:8px;color:#fff;font:14px monospace;background:#0008;padding:4px 8px}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script></head>
<body><div id="hud"></div>
<script type="module">
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9ec5e8);
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,1.2));
let cam = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 500), camName='overhead', t=0;
const sl = window.sl = { world:null, ready:null };
sl.loadWorld = async (url)=>{ const m = await import(url); sl.world = m.default(THREE); scene.add(sl.world.root); sl.world.setTime(t); };
sl.setCamera = (id)=>{ camName=id; if(id==='overhead'){ cam=new THREE.OrthographicCamera(-40*innerWidth/innerHeight,40*innerWidth/innerHeight,40,-40,1,300); cam.position.set(0,100,0); cam.up.set(0,0,-1); cam.lookAt(0,0,0);} else { const w=sl.world.witnesses.find(w=>w.id===id); cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,500); cam.position.set(w.position[0],w.eyeHeight||w.position[1],w.position[2]); const tg=typeof w.lookAt==='string'?new THREE.Box3().setFromObject(sl.world.objects[w.lookAt].node).getCenter(new THREE.Vector3()):new THREE.Vector3(...w.lookAt); cam.lookAt(tg);} sl.renderFrame(); };
sl.setTime = (x)=>{ t=x; sl.world.setTime(x); sl.renderFrame(); };
sl.renderFrame = ()=>{ renderer.render(scene,cam); document.getElementById('hud').textContent=camName+'  t='+t.toFixed(2)+'s  SIMULATED / FICTIONAL WITNESSES'; };
sl.ready = (async()=>{ await sl.loadWorld(q.get('world')); sl.setCamera(q.get('cam')||'overhead'); if(q.get('t')) sl.setTime(+q.get('t')); sl.renderFrame(); })();
</script></body></html>
