<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sightline — Cases</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { display: block; overflow: auto; }
  #top { height: 54px; position: sticky; top: 0; z-index: 5; }
  .wrap { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 54px); }
  .side { background: var(--panel); border-right: 1px solid var(--line); padding: 16px; }
  .main { padding: 28px 36px 60px; max-width: 980px; }
  .side .newbtn { width: 100%; margin-bottom: 14px; padding: 10px; }
  .caselist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .caselist li { border: 1px solid var(--line); background: var(--panel2); border-radius: 5px; padding: 10px 12px; cursor: pointer; }
  .caselist li:hover { border-color: var(--muted); }
  .caselist li.sel { border-color: var(--accent); }
  .caselist .t { font: 600 13px var(--serif); display: block; margin-bottom: 3px; }
  .caselist .s { font-size: 11px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .pill { font: 700 9px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; padding: 3px 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); }
  .pill.done { color: var(--green); border-color: rgba(61,220,132,.4); }
  .pill.running { color: var(--accent); border-color: rgba(226,176,82,.5); }
  .pill.error { color: var(--red); border-color: rgba(255,90,90,.45); }
  h1 { font: 600 24px/1.2 var(--serif); margin: 0 0 6px; }
  .lede { color: var(--muted); margin: 0 0 24px; max-width: 640px; }
  label.f { display: block; font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  input[type=text] { width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--text); padding: 10px 12px; border-radius: 4px; font: 14px var(--sans); }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  #drop { margin-top: 18px; border: 1.5px dashed #34405a; border-radius: 8px; padding: 34px 20px; text-align: center; background: var(--panel); cursor: pointer; transition: border-color .15s, background .15s; }
  #drop.over { border-color: var(--accent); background: rgba(226,176,82,.06); }
  #drop strong { display: block; font: 600 15px var(--serif); margin-bottom: 4px; }
  #drop span { color: var(--muted); font-size: 12px; }
  .files { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 4px; }
  .files li { display: flex; align-items: center; gap: 10px; padding: 7px 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; font-size: 12px; }
  .files .ty { font: 700 9px var(--mono); letter-spacing: .08em; color: var(--accent); width: 44px; text-transform: uppercase; flex: none; }
  .files .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files .sz { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .files .rm { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 15px; }
  .files .rm:hover { color: var(--red); }
  .files .nt { color: var(--muted); font-size: 11px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 14px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  .actions { display: flex; gap: 10px; margin-top: 18px; align-items: center; }
  .btn { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 9px 16px; font: 600 13px var(--sans); cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); color: #17130a; border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: default; }
  .err { color: var(--red); font-size: 12px; margin-top: 10px; }
  .meta { display: flex; gap: 14px; align-items: center; margin-bottom: 4px; }
  /* steps */
  .steps { display: flex; flex-wrap: wrap; gap: 6px; margin: 20px 0 12px; }
  .step { font: 600 11px var(--sans); padding: 6px 10px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .step::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #3a4658; }
  .step.active { color: var(--accent); border-color: rgba(226,176,82,.5); }
  .step.active::before { background: var(--accent); animation: pulse 1s infinite; }
  .step.done { color: var(--text); }
  .step.done::before { background: var(--green); }
  .step.fail { color: var(--red); border-color: rgba(255,90,90,.45); }
  .step.fail::before { background: var(--red); }
  @keyframes pulse { 50% { opacity: .3; } }
  #log { background: #080b10; border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; font: 12px/1.6 var(--mono); max-height: 360px; overflow-y: auto; min-height: 90px; }
  #log div { white-space: pre-wrap; word-break: break-word; }
  #log .t { color: #56627a; margin-right: 8px; }
  #log .st { color: var(--accent); margin-right: 8px; text-transform: uppercase; font-size: 10px; letter-spacing: .08em; }
  #log .e { color: var(--red); }
  #log .ok { color: var(--green); }
  .sect { margin-top: 28px; }
  .banner { margin-top: 14px; padding: 10px 12px; border: 1px solid rgba(226,176,82,.4); background: rgba(226,176,82,.07); color: var(--accent); border-radius: 4px; font-size: 12px; }
  .empty { color: var(--muted); padding: 60px 0; }
  @media (max-width: 800px) { .wrap { grid-template-columns: 1fr; } .main { padding: 20px; } }
</style>
</head>
<body>
<header id="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <div>
      <div class="case-title">Sightline</div>
      <div class="case-sub">Cases &middot; upload evidence, reconstruct, test testimony</div>
    </div>
  </div>
  <span class="sim-badge" id="modeBadge">MODE</span>
  <nav style="margin-left:auto"><a href="/" class="btn" style="text-decoration:none">Open viewer</a></nav>
</header>

<div class="wrap">
  <aside class="side">
    <button class="btn primary newbtn" id="newBtn">+ New case</button>
    <h3 style="margin-top:4px">Cases</h3>
    <ul class="caselist" id="caselist"><li class="muted">Loading…</li></ul>
  </aside>

  <main class="main" id="content"></main>
</div>

<script type="module">
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtSize = (n) => n > 1e6 ? (n / 1e6).toFixed(1) + ' MB' : n > 1e3 ? Math.round(n / 1e3) + ' KB' : n + ' B';
const EXT_TYPE = { pdf: 'pdf', txt: 'text', md: 'text', markdown: 'text', docx: 'text', rtf: 'text', csv: 'text', json: 'text', srt: 'text', vtt: 'text',
  png: 'image', jpg: 'image', jpeg: 'image', webp: 'image', gif: 'image', mp4: 'video', mov: 'video', webm: 'video', m4v: 'video', mkv: 'video' };
const typeOf = (name) => EXT_TYPE[(name.split('.').pop() || '').toLowerCase()] || null;

const STEPS = [
  ['extract', 'Extracting text'],
  ['upload', 'Uploading videos to Argon'],
  ['generate', 'Generating world'],
  ['render', 'Rendering views'],
  ['checks', 'Independent checks'],
  ['critique', 'Argon critique'],
  ['patch', 'Applying fix'],
];
const stepKey = (ev) => {
  const s = String(ev.step || '').toLowerCase();
  if (/upload|files?$|video|evidence/.test(s)) return 'upload';
  if (/gen/.test(s)) return 'generate';
  if (/render/.test(s)) return 'render';
  if (/check/.test(s)) return 'checks';
  if (/critique|review/.test(s)) return 'critique';
  if (/patch|fix|apply/.test(s)) return 'patch';
  if (/extract|ingest|text/.test(s)) return 'extract';
  return null;
};

let cases = [];
let current = null;      // case id
let pending = [];        // File[] for the new-case form
let es = null;
let modeName = 'mock';

async function api(url, opt) {
  const r = await fetch(url, opt);
  let j = null; try { j = await r.json(); } catch (_) {}
  if (!r.ok) { const e = new Error((j && j.error) || 'HTTP ' + r.status); e.body = j; throw e; }
  return j;
}

async function refreshList() {
  try { cases = await api('/api/cases'); } catch (e) { cases = []; }
  const ul = $('#caselist');
  if (!cases.length) { ul.innerHTML = '<li class="muted" style="cursor:default">No cases yet.</li>'; return; }
  ul.innerHTML = cases.map((c) => `<li data-id="${esc(c.caseId)}" class="${c.caseId === current ? 'sel' : ''}">
      <span class="t">${esc(c.title)}</span>
      <span class="s"><span class="pill ${esc(c.status)}">${esc(c.status === 'done' || c.hasWorld ? (c.status === 'running' ? 'running' : 'ready') : c.status)}</span>${c.fileCount} file${c.fileCount === 1 ? '' : 's'}</span></li>`).join('');
  ul.querySelectorAll('li[data-id]').forEach((li) => { li.onclick = () => selectCase(li.dataset.id); });
}

// ---------- new case form ----------
function showNew() {
  current = null; pending = [];
  if (es) { es.close(); es = null; }
  history.replaceState(null, '', location.pathname);
  refreshList();
  $('#content').innerHTML = `
    <h1>New case</h1>
    <p class="lede">Upload everything you have on a crash: police and expert reports, depositions and statements, photos, diagrams, and any video (videotaped depositions, dashcam, bodycam). Argon reads and watches it all and builds a 3D reconstruction you can test from each witness's position.</p>
    <label class="f" for="title">Case title</label>
    <input type="text" id="title" placeholder="e.g. Doe v. Acme Freight, 2025-CV-1042" autocomplete="off">
    <div id="drop" tabindex="0" role="button" aria-label="Add files">
      <strong>Drop files here or click to browse</strong>
      <span>PDF, TXT, MD, DOCX &middot; PNG, JPG &middot; MP4, MOV, WEBM</span>
      <input type="file" id="picker" multiple hidden accept=".pdf,.txt,.md,.markdown,.docx,.png,.jpg,.jpeg,.webp,.mp4,.mov,.webm,.m4v">
    </div>
    <ul class="files" id="flist"></ul>
    <div class="bar" id="ubar" hidden><i></i></div>
    <div class="err" id="uerr"></div>
    <div class="actions"><button class="btn primary" id="createBtn" disabled>Create case</button><span class="muted small" id="usum"></span></div>`;
  const drop = $('#drop'), picker = $('#picker');
  drop.onclick = () => picker.click();
  drop.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') picker.click(); };
  picker.onchange = () => { addFiles([...picker.files]); picker.value = ''; };
  ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', async (e) => addFiles(await collectDropped(e.dataTransfer)));
  $('#createBtn').onclick = createCase;
  renderPending();
}
async function collectDropped(dt) {
  // support dropped folders where the browser exposes entries
  const items = [...(dt.items || [])].map((i) => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (!items.length) return [...dt.files];
  const out = [];
  const walk = async (en) => {
    if (en.isFile) out.push(await new Promise((res, rej) => en.file(res, rej)));
    else if (en.isDirectory) {
      const rd = en.createReader();
      for (;;) { const batch = await new Promise((res, rej) => rd.readEntries(res, rej)); if (!batch.length) break; for (const b of batch) await walk(b); }
    }
  };
  for (const en of items) await walk(en);
  return out;
}
function addFiles(files) {
  for (const f of files) {
    if (!typeOf(f.name)) continue;
    if (pending.some((p) => p.name === f.name && p.size === f.size)) continue;
    pending.push(f);
  }
  renderPending();
}
function renderPending() {
  const ul = $('#flist'); if (!ul) return;
  ul.innerHTML = pending.map((f, i) => `<li><span class="ty">${typeOf(f.name)}</span><span class="nm">${esc(f.name)}</span><span class="sz">${fmtSize(f.size)}</span><button class="rm" data-i="${i}" title="Remove" aria-label="Remove">&times;</button></li>`).join('');
  ul.querySelectorAll('.rm').forEach((b) => { b.onclick = () => { pending.splice(+b.dataset.i, 1); renderPending(); }; });
  $('#createBtn').disabled = !pending.length;
  const total = pending.reduce((n, f) => n + f.size, 0);
  $('#usum').textContent = pending.length ? `${pending.length} file(s), ${fmtSize(total)}` : '';
}
function createCase() {
  const btn = $('#createBtn'); btn.disabled = true;
  const fd = new FormData();
  fd.append('title', $('#title').value.trim() || 'Untitled case');
  pending.forEach((f) => fd.append('files', f, f.name));
  const bar = $('#ubar'); bar.hidden = false;
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/cases');
  xhr.upload.onprogress = (e) => { if (e.lengthComputable) { bar.firstElementChild.style.width = (100 * e.loaded / e.total) + '%'; $('#usum').textContent = `Uploading… ${Math.round(100 * e.loaded / e.total)}%`; } };
  xhr.onload = async () => {
    let j = null; try { j = JSON.parse(xhr.responseText); } catch (_) {}
    if (xhr.status >= 200 && xhr.status < 300 && j) { pending = []; await refreshList(); selectCase(j.caseId); }
    else { $('#uerr').textContent = (j && j.error) || 'Upload failed (HTTP ' + xhr.status + ')'; btn.disabled = false; bar.hidden = true; }
  };
  xhr.onerror = () => { $('#uerr').textContent = 'Network error during upload.'; btn.disabled = false; bar.hidden = true; };
  xhr.send(fd);
  $('#usum').textContent = 'Uploading…';
}

// ---------- case detail + run ----------
async function selectCase(id) {
  current = id;
  history.replaceState(null, '', '?case=' + encodeURIComponent(id));
  if (es) { es.close(); es = null; }
  let c;
  try { c = await api('/api/cases/' + encodeURIComponent(id)); } catch (e) { $('#content').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  refreshList();
  const hasWorld = !!(c.state && c.state.world);
  const finds = (c.state && c.state.findings) || [];
  const contradictions = finds.filter((f) => f.status === 'contradiction').length;
  $('#content').innerHTML = `
    <div class="meta"><h1 style="margin:0">${esc(c.title)}</h1><span class="pill ${esc(c.status)}">${esc(c.status)}</span></div>
    <p class="lede mono small">${esc(c.caseId)} &middot; created ${esc(new Date(c.createdAt).toLocaleString())}${hasWorld ? ` &middot; ${finds.length} finding(s), ${contradictions} contradiction(s)` : ''}</p>
    <h3>Evidence (${c.files.length})</h3>
    <ul class="files">${c.files.map((f) => `<li><span class="ty">${esc(f.type)}</span><a class="nm" style="color:inherit;text-decoration:none" href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>
      <span class="nt">${f.pages ? f.pages + ' pp' : ''}${f.durationSec ? Math.round(f.durationSec / 60 * 10) / 10 + ' min' : ''}${f.note ? ' ' + esc(f.note) : ''}${f.error ? ' <span style="color:var(--red)">' + esc(f.error) + '</span>' : ''}</span>
      <span class="sz">${fmtSize(f.size)}</span></li>`).join('')}</ul>
    <div class="actions">
      <button class="btn primary" id="runBtn">${hasWorld ? 'Re-run reconstruction' : 'Run reconstruction'}</button>
      ${hasWorld ? `<a class="btn" style="text-decoration:none" href="/?case=${encodeURIComponent(id)}">Open viewer</a>` : ''}
      <span class="muted small">Mode: <b>${esc(modeName)}</b>${modeName === 'mock' ? ' (replays cached Argon output; live runs happen on the laptop with an API key)' : ''}</span>
    </div>
    <div id="banner"></div>
    <div class="sect" id="progress" ${c.running || (c.status === 'error') ? '' : 'hidden'}>
      <h3>Progress</h3>
      <div class="steps" id="steps"></div>
      <div id="log" aria-live="polite"></div>
    </div>`;
  $('#runBtn').onclick = () => runCase(id);
  if (c.running) attachStream(id);
  else if (c.status === 'error' && c.error) { $('#progress').hidden = false; $('#runBtn').textContent = 'Retry reconstruction'; logLine({ step: 'error', message: c.error }, true); drawSteps(); }
}

const stepState = {};
function drawSteps() {
  const el = $('#steps'); if (!el) return;
  el.innerHTML = STEPS.map(([k, label]) => `<span class="step ${stepState[k] || ''}">${label}${k === 'generate' && stepState.round ? '' : ''}</span>`).join('') +
    (stepState.round ? `<span class="step active">Round ${stepState.round}</span>` : '');
}
function logLine(ev, isErr) {
  const log = $('#log'); if (!log) return;
  const d = document.createElement('div');
  const t = ev.at ? new Date(ev.at).toLocaleTimeString([], { hour12: false }) : new Date().toLocaleTimeString([], { hour12: false });
  const label = ev.step || ev.type || '';
  d.innerHTML = `<span class="t">${esc(t)}</span><span class="st">${esc(label)}${ev.round ? ' r' + esc(ev.round) : ''}</span><span class="${isErr ? 'e' : (ev.type === 'done' ? 'ok' : '')}">${esc(ev.message || (ev.type === 'start' ? 'Started (' + (ev.mode || '') + ')' : ''))}</span>`;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function onEvent(id, ev) {
  if (ev.type === 'hello') return;
  if (ev.type === 'progress' || ev.type === 'start') {
    const k = stepKey(ev);
    if (k) {
      const idx = STEPS.findIndex((s) => s[0] === k);
      STEPS.forEach(([sk], i) => { if (i < idx && stepState[sk] !== 'done') stepState[sk] = 'done'; });
      // a new round restarts the cycle at generate/render
      if (ev.round && ev.round !== stepState.round && ev.round > 1 && (k === 'render' || k === 'generate')) { STEPS.forEach(([sk]) => { stepState[sk] = (sk === 'extract' || sk === 'upload' || sk === 'generate') ? 'done' : ''; }); }
      if (ev.round) stepState.round = ev.round;
      stepState[k] = 'active';
    }
    logLine(ev);
  } else if (ev.type === 'error') {
    for (const [k] of STEPS) if (stepState[k] === 'active') stepState[k] = 'fail';
    logLine(ev, true);
    const rb = $('#runBtn'); if (rb) { rb.disabled = false; rb.textContent = 'Retry reconstruction'; }
    es && es.close(); es = null; refreshList();
  } else if (ev.type === 'done') {
    STEPS.forEach(([k]) => { stepState[k] = 'done'; });
    stepState.round = 0;
    logLine({ ...ev, step: 'done', message: 'Reconstruction complete. Opening the viewer…' });
    es && es.close(); es = null; refreshList();
    setTimeout(() => { location.href = '/?case=' + encodeURIComponent(id); }, 1600);
  }
  drawSteps();
}
function attachStream(id) {
  Object.keys(stepState).forEach((k) => delete stepState[k]);
  $('#progress').hidden = false; $('#log').innerHTML = '';
  const rb = $('#runBtn'); if (rb) { rb.disabled = true; rb.textContent = 'Running…'; }
  drawSteps();
  es = new EventSource(`/api/cases/${encodeURIComponent(id)}/stream`);
  es.onmessage = (m) => { try { onEvent(id, JSON.parse(m.data)); } catch (_) {} };
  es.onerror = () => { /* browser auto-reconnects; history is replayed by the server */ };
}
async function runCase(id) {
  $('#banner').innerHTML = '';
  const btn = $('#runBtn'); btn.disabled = true;
  try {
    await api(`/api/cases/${encodeURIComponent(id)}/run`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    attachStream(id);
  } catch (e) {
    btn.disabled = false;
    $('#banner').innerHTML = `<div class="banner">${esc(e.message)}${e.body && e.body.blockedOn ? ' <span class="muted">(waiting on: ' + esc(e.body.blockedOn) + ')</span>' : ''}</div>`;
  }
}

// ---------- boot ----------
$('#newBtn').onclick = showNew;
(async () => {
  try { const h = await api('/api/health'); modeName = h.mode; $('#modeBadge').textContent = h.mode === 'live' ? 'LIVE ARGON' : 'MOCK MODE (CACHED)'; } catch (_) { $('#modeBadge').textContent = 'SERVER OFFLINE'; }
  await refreshList();
  const want = new URLSearchParams(location.search).get('case');
  if (want) selectCase(want); else if (cases.length && new URLSearchParams(location.search).get('new') == null) selectCase(cases[0].caseId); else showNew();
})();
</script>
</body>
</html>
