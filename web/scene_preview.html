<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene Kit Preview</title>
<style>
  :root { --bg: #e9edf0; --fg: #1d232a; --muted: #5b6672; --panel: rgba(255,255,255,0.86); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #12161a; --fg: #e6eaee; --muted: #9aa6b2; --panel: rgba(20,24,28,0.82); } }
  :root[data-theme="dark"] { --bg: #12161a; --fg: #e6eaee; --muted: #9aa6b2; --panel: rgba(20,24,28,0.82); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 12px; top: 12px; background: var(--panel); padding: 8px 10px; border-radius: 6px; max-width: calc(100vw - 48px); }
  #hud b { font-weight: 600; } #hud span { color: var(--muted); }
  #views { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  #views a { color: inherit; text-decoration: none; border: 1px solid var(--muted); border-radius: 4px; padding: 1px 6px; }
  body.clean #hud { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud"><b>Scene kit preview</b> <span id="info">loading…</span>
  <div id="views">
    <a href="?view=eye">eye (EB shoulder)</a><a href="?view=driver">driver EB</a><a href="?view=intersection">at side road</a>
    <a href="?view=crossover">crossover oblique</a><a href="?view=store">store (median eye)</a><a href="?view=lot">lot oblique</a><a href="?view=crest">toward crest</a><a href="?view=overhead">overhead</a><a href="?view=wide">overhead wide</a>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import * as K from './assets/scene.js';
import * as ENV from './assets/environment.js';

const q = new URLSearchParams(location.search);
const view = q.get('view') || 'eye';
if (q.has('clean')) document.body.classList.add('clean');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight, false);
ENV.configureRenderer(THREE, renderer);
document.body.appendChild(renderer.domElement);
K.setAnisotropy(renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
const t0 = performance.now();

// ---------------------------------------------------------------- the demo site (case live1 geometry)
// Origin = centre of the EB outside lane on the NE 140th Ct centreline (world_v1). Highway runs east-west.
const FT = 0.3048;
const medianW = 78 * FT;                   // EB inside edge -> WB inside edge (turn lane + median + shoulders)
const zC = -5.49 - medianW / 2;            // highway centreline z
K.hillCrest({ at: [-345, zC], heading: -Math.PI / 2, gradeUp: 0.02, lengthUp: 400, gradeDown: 0.0215, lengthDown: 444.7, curve: 240, datumAt: 345 });

const hw = K.road({ id: 'road_us27a', lanes: 4, laneWidth: 12 * FT, divided: true, medianWidth: medianW, length: 1700,
  shoulderWidth: 5 * FT, leftShoulderWidth: 2 * FT, position: [100, zC], heading: -Math.PI / 2,
  openings: [{ at: -100, width: 130 * FT, radius: 6, curb: true, stopBars: true }],
  turnLanes: [{ carriageway: 'reverse', stopAt: -100 + 65 * FT, length: 550 * FT - 15, taper: 15 }],
  sideRoads: [{ at: -100, side: 'right', width: 6.1, radius: 9 }] });
scene.add(hw);
const outer = hw.userData.edges.outer;      // centreline -> outside edge of shoulder
const sideStart = zC + outer;
const side = K.road({ id: 'road_ne140th', lanes: 2, laneWidth: 3.05, shoulderWidth: 0, markings: 'center_double', edgeLines: false,
  length: 260, position: [0, sideStart + 130], heading: 0, stopBar: { s: 130 - 1.5, side: 'right' }, rpms: false, roadside: { ditchDepth: 0.35 } });
scene.add(side);
scene.add(K.groundPlane({ id: 'ground', size: 4000, kind: 'pasture' }));
scene.add(K.impactMarker({ id: 'mark_poi', position: [0, 0] }));
scene.add(K.skidMark({ id: 'mark_demo_skid', points: [[-62, 0.15], [-40, 0.2], [-20, 0.35], [-4, 0.6]], pair: true, track: 1.62 }));

// ---------------------------------------------------------------- site context (from the USGS NAIP aerial, cases/demo/exhibits/aerial)
// Dense slash-pine / mixed forest both sides behind mown rights-of-way; a flat-roof store + paved lot on the north
// side at the crossover; a small building + paved lot SW of the side road; open pasture SE with scattered oaks.
const zN = zC - outer, zS = zC + outer;                 // outer pavement edges (north = WB, south = EB)
scene.add(K.treeline({ id: 'forest_nw', points: [[-900, zN - 70], [-400, zN - 60], [-125, zN - 55]], depth: 70, spacing: 7, seed: 3, height: 15, pineRatio: 0.8 }));
scene.add(K.treeline({ id: 'forest_ne', points: [[-20, zN - 75], [300, zN - 60], [900, zN - 62]], depth: 70, spacing: 7, seed: 4, height: 15, pineRatio: 0.75 }));
scene.add(K.treeline({ id: 'forest_sw', points: [[-900, zS + 45], [-400, zS + 40], [-40, zS + 75]], depth: 60, spacing: 7, seed: 5, height: 14, pineRatio: 0.65 }));
scene.add(K.treeline({ id: 'forest_se_far', points: [[230, zS + 40], [500, zS + 60], [900, zS + 55]], depth: 60, spacing: 7, seed: 8, height: 14, pineRatio: 0.7 }));

// furniture (other agents' library; stubs if absent)
const add = (o, x, z, ry = 0) => { o.position.set(x, K.roadHeight(x, z), z); o.rotation.y = ry; scene.add(o); return o; };
try {
  // pasture fence along the SE field
  { const f = K.fence({ id: 'fence_se', points: [[30, zS + 24], [230, zS + 24]] }); scene.add(f); }
  // pole line (wood, crossarm + conductors spanning to the previous pole), south right-of-way
  let prev = null;
  for (let x = -760; x <= 800; x += 46) { if (x > -8 && x < 30) continue; add(K.pole({ id: 'pole_' + x, height: 10.7, ...(prev !== null ? { span: x - prev } : {}), transformer: x === 68 }), x, zS + 13, Math.PI / 2); prev = x; }
  // MUTCD signs: stop + street-name blades on the side road, speed limit and side-road warning on US-27A
  add(K.sign('stop', { id: 'sig_stop', streetName: 'NE 140TH CT', streetName2: 'US 27 ALT' }), 4.6, sideStart + 3.4, Math.PI);
  add(K.sign('speed_limit', { id: 'sig_speed', speed: 60, rural: true }), -260, zS + 2.5, Math.PI / 2);
  add(K.sign('side_road_right', { id: 'sig_warn', rural: true }), -320, zS + 2.5, Math.PI / 2);
  add(K.sign('route_shield', { id: 'sig_route', text: '27', rural: true }), 120, zN - 2.5, -Math.PI / 2);
  add(K.sign('stop', { id: 'sig_stop_med_a', rural: true }), 65 * FT + 1.6, zC - 5.4, Math.PI);
  // north-side store: flat-roof commercial (storefront + awning facing the highway), lot with stalls, driveway apron
  const storeZ = zN - 58;
  scene.add(K.sitePad({ id: 'pad_store', position: [-66, storeZ], width: 24, depth: 40, paved: false, surface: 'concrete' }));
  add(K.building({ id: 'bld_store', style: 'commercial', w: 20, d: 36, h: 5.6, color: '#e4ddd0' }), -66, storeZ, Math.PI);
  scene.add(K.parkingLot({ id: 'lot_store', position: [-48, storeZ + 30], width: 44, depth: 22, rows: 2, heading: 0 }));
  scene.add(K.driveway({ id: 'dw_store_w', position: [-62, zN], heading: 0, width: 7.3, length: zN - (storeZ + 41) + 0.5 }));
  scene.add(K.driveway({ id: 'dw_store_e', position: [-30, zN], heading: 0, width: 7.3, length: zN - (storeZ + 41) + 0.5 }));
  // small building + paved lot SW of the side road
  scene.add(K.parkingLot({ id: 'lot_sw', position: [-16, zS + 16], width: 18, depth: 18, rows: 1, accessible: 0 }));
  add(K.building({ id: 'bld_sw', style: 'commercial', w: 11, d: 9, h: 4.2, awning: false, color: '#cfc6b6', material: 'brick' }), -16, zS + 32, 0);
  scene.add(K.driveway({ id: 'dw_sw', position: [-16, zS], heading: Math.PI, width: 7.3, length: 7.5 }));
  // houses along the side road (south)
  add(K.building({ id: 'house_1', style: 'house', w: 12, d: 9 }), -22, zS + 120, -Math.PI / 2);
  add(K.building({ id: 'house_2', style: 'house', w: 13, d: 9, color: '#cfd6d8' }), 26, zS + 150, Math.PI / 2);
  // scattered live oaks in the SE pasture, a few by the buildings; shrubs at the store
  for (const [x, z, h, k] of [[60, zS + 60, 10, 'oak'], [110, zS + 85, 12, 'oak'], [150, zS + 52, 9, 'oak'], [190, zS + 110, 11, 'oak'], [85, zS + 130, 10, 'oak'], [-36, zS + 40, 11, 'oak'], [-80, storeZ + 26, 9, 'oak'], [-90, storeZ - 8, 17, 'pine'], [-40, storeZ - 14, 19, 'pine']])
    add(K.tree({ id: 'tree_' + x + '_' + z, kind: k, height: h, moss: k === 'oak' }), x, z, x);
  for (let i = 0; i < 6; i++) add(K.tree({ id: 'shrub_' + i, kind: 'shrub', height: 1.1 + (i % 3) * 0.2 }), -74 + i * 3.2, storeZ + 20.2, i);
} catch (e) { console.warn('furniture', e); }

// ---------------------------------------------------------------- environment (sun, sky, fog for 2016-05-07 16:36 EDT, Levy County FL)
let env = null;
try {
  env = ENV.environment(THREE, { date: '2016-05-07T16:36:00-04:00', lat: 29.39, lon: -82.55, weather: 'clear', Sky, center: [0, 0], radius: 140 });
  scene.add(env.group); if (env.fog) scene.fog = env.fog; if (env.background && !env.sky) scene.background = env.background;
} catch (e) {
  console.warn('environment', e);
  scene.background = new THREE.Color(0xbcd3ea); scene.fog = new THREE.Fog(0xd5e0ea, 300, 2400);
  const sun = new THREE.DirectionalLight(0xffffff, 2.5); sun.position.set(-200, 300, 50); scene.add(sun, new THREE.HemisphereLight(0xcfe3ff, 0x6b6a4a, 1));
}

// ---------------------------------------------------------------- cameras
const aspect = innerWidth / innerHeight;
const cam = new THREE.PerspectiveCamera(60, aspect, 0.1, 2000);
const eye = (x, z, lx, lz, h = 1.6, ly = null) => { const y = K.roadHeight(x, z); cam.position.set(x, y + h, z); cam.lookAt(lx, ly ?? (K.roadHeight(lx, lz) + h * 0.9), lz); };
const VIEWS = {
  eye: () => eye(-150, 2.6, 60, 0.5),                               // standing on EB shoulder, looking east toward the crossover
  driver: () => { cam.fov = 60; eye(-110, -0.4, 0, -0.2, 1.15); },   // driver eye, EB outside lane
  intersection: () => eye(-2.5, 30, 0, -40, 1.6),                    // on NE 140th Ct looking north across the highway
  crest: () => eye(60, -1.2, -400, -1.2, 1.6),
  crossover: () => { cam.fov = 45; cam.position.set(-75, 30, 45); cam.lookAt(-5, 0, zC - 8); },
  store: () => eye(-10, zC - 2, -60, zC - 60, 1.6),
  lot: () => { cam.fov = 50; cam.position.set(-10, 22, zC - 10); cam.lookAt(-55, 0, zC - 70); },                       // looking west up to the crest
  overhead: () => { cam.position.set(0, 120, zC + 10); cam.up.set(0, 0, -1); cam.lookAt(0, 0, zC + 10); },
  wide: () => { cam.position.set(-60, 520, zC); cam.up.set(0, 0, -1); cam.lookAt(-60, 0, zC); },
};
(VIEWS[view] || VIEWS.eye)();
cam.updateProjectionMatrix();

function render() { env?.update?.(cam, [cam.position.x, cam.position.z]); renderer.render(scene, cam); }
render(); render();
const ms = Math.round(performance.now() - t0);
let tris = 0; scene.traverse(o => { if (o.isMesh && o.geometry?.index) tris += o.geometry.index.count / 3 * (o.isInstancedMesh ? o.count : 1); });
document.getElementById('info').textContent = `${view} · built ${ms} ms · ${Math.round(tris / 1000)}k tris · furniture ${K.LOADED.furniture ? 'lib' : 'stub'}`;
window.preview = { ready: Promise.resolve(true), render, scene, cam, K };
window.__ready = true;
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); render(); });
</script>
</body>
</html>
