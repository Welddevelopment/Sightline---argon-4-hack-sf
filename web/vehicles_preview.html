<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vehicle Library Preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #d9dcdf; overflow: hidden; font: 12px/1.3 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #stage { position: fixed; inset: 0; }
  .lbl { position: absolute; transform: translate(-50%, 0); color: #1d2329; background: rgba(255,255,255,.86); border: 1px solid rgba(0,0,0,.12);
         padding: 3px 7px; border-radius: 3px; white-space: nowrap; pointer-events: none; }
  .lbl b { font-weight: 600; letter-spacing: .02em; }
  .lbl span { color: #5b6670; margin-left: 6px; font-variant-numeric: tabular-nums; }
  #hud { position: fixed; left: 12px; top: 10px; color: #2a3138; background: rgba(255,255,255,.8); padding: 6px 10px; border-radius: 4px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="hud">Sightline vehicle library · 1 m grid · procedural, catalog dimensions</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createVehicle, VEHICLE_DIMS } from './assets/vehicles.js';

const q = new URLSearchParams(location.search);
const types = (q.get('types') || 'sedan,suv,pickup,van,box_truck,truck_tractor,bus,motorcycle,bicycle,pedestrian').split(',').filter(Boolean);
const colors = (q.get('colors') || 'silver,white,red,navy,white,blue,yellow,black,green,gray').split(',');
const lightsOn = q.get('lights') === '1';
const night = q.get('night') === '1';

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = night ? 0.6 : 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(night ? 0x0b0d10 : 0xd9dcdf);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = night ? 0.05 : 0.9;

const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8f94, night ? 0.02 : 0.6); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, night ? 0.02 : 2.2);
sun.position.set(-18, 30, -14); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 120 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);

// ground + 1 m grid
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: night ? 0x202326 : 0xc4c8cc, roughness: 0.92 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(200, 200, 0x7d858d, 0x9aa1a8); grid.position.y = 0.002;
grid.material.transparent = true; grid.material.opacity = 0.55; scene.add(grid);

// lineup: side by side along X, all facing -Z (north)
const labels = [];
let x = 0; const gap = 1.6; const placed = [];
types.forEach((t, i) => {
  const dims = VEHICLE_DIMS[t] || { width: 0.6, length: 0.5, height: 1.7 };
  const v = createVehicle(THREE, t, { id: t + '_1', color: colors[i % colors.length] });
  const w = v.userData.dims?.width || dims.width;
  x += (i ? gap : 0) + w / 2;
  v.position.x = x;
  if (q.get('yaw')) v.rotation.y = parseFloat(q.get('yaw'));
  scene.add(v);
  if (lightsOn && v.userData.setLights) v.userData.setLights(true);
  placed.push(v);
  const d = v.userData.dims || dims;
  const el = document.createElement('div'); el.className = 'lbl';
  el.innerHTML = `<b>${t}</b><span>${d.length ?? '-'} × ${d.width ?? '-'} × ${d.height ?? '-'} m</span>`;
  document.body.appendChild(el);
  labels.push({ el, pos: new THREE.Vector3(x, 0, (d.length || 1) / 2 + 0.9) });
  x += w / 2;
});
const cx = x / 2;
for (const v of placed) v.position.x -= cx;
for (const l of labels) l.pos.x -= cx;

const camera = new THREE.PerspectiveCamera(parseFloat(q.get('fov') || 30), innerWidth / innerHeight, 0.05, 500);
const focus = q.get('focus');
let target = new THREE.Vector3(0, 1.0, 0);
if (focus) {
  const v = placed[types.indexOf(focus)];
  if (v) { target = new THREE.Vector3(v.position.x, (v.userData.dims?.height || 1.5) * 0.45, 0); }
}
const view = q.get('view') || 'threequarter';
const span = focus ? Math.max(4, (placed[types.indexOf(focus)]?.userData.dims?.length || 5) * 1.25) : Math.max(x, 10);
const dist = span / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.05;
const views = {
  threequarter: [ -0.55, 0.32, -0.78 ], front: [0, 0.15, -1], side: [-1, 0.12, 0], rear: [0.5, 0.3, 0.8], top: [0, 1, 0.001], low: [-0.7, 0.08, -0.7],
};
const dir = new THREE.Vector3(...(views[view] || views.threequarter)).normalize();
camera.position.copy(target).addScaledVector(dir, dist * (focus ? 1 : 0.9));
if (q.get('cam')) camera.position.set(...q.get('cam').split(',').map(Number));
if (q.get('target')) target.set(...q.get('target').split(',').map(Number));
camera.lookAt(target);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(target); controls.update();

function placeLabels() {
  const v = new THREE.Vector3();
  for (const l of labels) {
    v.copy(l.pos).project(camera);
    const vis = v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1;
    l.el.style.display = vis && !focus ? '' : 'none';
    l.el.style.left = ((v.x + 1) / 2 * innerWidth) + 'px';
    l.el.style.top = ((1 - v.y) / 2 * innerHeight) + 'px';
  }
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); frame(); });
function frame() { renderer.render(scene, camera); placeLabels(); }
controls.addEventListener('change', () => requestAnimationFrame(frame));   // render on demand (cheap for headless stills)
frame();
window.__previewReady = true;
</script>
</body>
</html>
