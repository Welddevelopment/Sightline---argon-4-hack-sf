<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buildings Preview</title>
<style>
  :root { --bg: #c9d3da; --fg: #1d2328; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1a1f24; --fg: #e4e8eb; } }
  :root[data-theme="dark"] { --bg: #1a1f24; --fg: #e4e8eb; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; font: 13px system-ui, sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; left: 12px; top: 10px; background: rgba(0,0,0,.45); color: #fff; padding: 6px 10px; border-radius: 6px; }
  #hud a { color: #cfe6ff; margin-right: 8px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">Buildings ·
  <a href="?view=store">store</a><a href="?view=lot">lot</a><a href="?view=glass">glass</a><a href="?view=clerk">clerk</a><a href="?view=shelter">shelter</a><a href="?view=houses">houses</a><a href="?view=night">night</a></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as F from './assets/furniture.js';

const q = new URLSearchParams(location.search);
const view = q.get('view') || 'store';
const night = view === 'night';
if (q.get('clean')) document.getElementById('hud').style.display = 'none';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = night ? 0.85 : 0.95;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// outdoor sky environment (gradient dome + sun disc + dark ground) so glass reflects sky, not a white room
const skyScene = new THREE.Scene();
const skyMat = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, uniforms: { night: { value: night ? 1 : 0 } },
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform float night; varying vec3 vP; void main(){ float h = vP.y;
    vec3 top = mix(vec3(0.24,0.45,0.78), vec3(0.01,0.015,0.03), night), hor = mix(vec3(0.80,0.86,0.92), vec3(0.04,0.05,0.07), night), gnd = mix(vec3(0.25,0.27,0.2), vec3(0.01), night);
    vec3 c = h > 0.0 ? mix(hor, top, pow(h, 0.55)) : mix(hor, gnd, pow(-h, 0.35));
    vec3 sd = normalize(vec3(-0.55, 0.55, -0.62)); c += (1.0 - night) * vec3(6.0,5.6,5.0) * pow(max(dot(vP, sd), 0.0), 600.0);
    gl_FragColor = vec4(c, 1.0); }` });
skyScene.add(new THREE.Mesh(new THREE.SphereGeometry(100, 32, 16), skyMat));
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(skyScene, 0.0).texture;
scene.environmentIntensity = night ? 0.25 : 0.9;
scene.background = new THREE.Color(night ? 0x070a10 : 0xb7cbe0);
scene.fog = new THREE.Fog(scene.background, 140, 420);

const sun = new THREE.DirectionalLight(0xfff0dc, night ? 0.0 : 3.0);
sun.position.set(-38, 40, -44); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 220 });
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.03;
scene.add(sun, new THREE.HemisphereLight(0xcfe0f0, 0x5a5848, night ? 0.05 : 0.55));
if (night) { const moon = new THREE.DirectionalLight(0x8090b0, 0.15); moon.position.set(30, 50, 20); scene.add(moon); }

// ground: grass + highway strip to the south (z = 36..50)
const gtex = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); g.fillStyle = '#66744a'; g.fillRect(0, 0, 256, 256); for (let i = 0; i < 6000; i++) { g.fillStyle = `rgba(${Math.random() < 0.5 ? '40,52,28' : '140,150,95'},${Math.random() * 0.35})`; g.fillRect(Math.random() * 256, Math.random() * 256, 2, 2); } const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(80, 80); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ map: gtex, roughness: 1 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const road = new THREE.Mesh(new THREE.PlaneGeometry(400, 14), new THREE.MeshStandardMaterial({ color: 0x3c3e40, roughness: 0.95 })); road.rotation.x = -Math.PI / 2; road.position.set(0, 0.01, 43); road.receiveShadow = true; scene.add(road);
for (const z of [36.4, 49.6]) { const l = new THREE.Mesh(new THREE.PlaneGeometry(400, 0.15), new THREE.MeshStandardMaterial({ color: 0xeeeeea })); l.rotation.x = -Math.PI / 2; l.position.set(0, 0.015, z); scene.add(l); }

const T0 = performance.now();
// the store: 24 x 20 m, storefront facing south toward the lot + highway (as at the US-27A / NE 140th Ct site)
const st = F.store(THREE, { id: 'store', w: 24, d: 20, h: 4.9, storefront: 'south', lit: night });
st.position.set(0, 0, 0); scene.add(st);
// lot: south of the storefront out to the highway + a strip along the east side
const lot = F.parkingLot(THREE, { id: 'lot', polygon: [[-14, 13.5], [-14, 32], [22, 32], [22, -10], [14, -10], [14, 13.5]],
  stalls: [{ from: [-11.5, 32], to: [11.5, 32], side: 1, ada: [3] }, { from: [22, 28], to: [22, -8], side: 1 }],
  aprons: [{ from: [-4, 32], to: [-4, 36.4], width: 7.3 }, { from: [12, 32], to: [12, 36.4], width: 7.3 }] });
scene.add(lot);
// a couple of parked cars for scale
const pv = (i, col) => { const s = lot.userData.stalls[i]; const v = F.parkedVehicle(null, 'sedan', { id: 'pv' + i, color: col }); v.position.set(s.x, 0.03, s.z); v.rotation.y = s.heading; scene.add(v); };
pv(1, 0x8a1f1f); pv(5, 0x2b3e5c); pv(10, 0xb8b8b4);
// bus shelter at the SE, by the highway
const sh = F.shelter({ id: 'shelter' }); sh.position.set(30, 0, 33.6); sh.rotation.y = Math.PI; scene.add(sh);
// houses along a side road to the west
const hs = [F.house(THREE, { id: 'h_ranch', w: 12, d: 8.5, style: 'ranch' }), F.house(THREE, { id: 'h_hip', w: 13, d: 9, style: 'hip' }), F.house(THREE, { id: 'h_mobile', w: 18, d: 4.3, style: 'mobile' })];
hs.forEach((h, i) => { h.position.set(-34, 0, -22 + i * 18); h.rotation.y = -Math.PI / 2; scene.add(h); });
console.warn('build ms', Math.round(performance.now() - T0));

const cam = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 800);
const A = st.userData.anchors;
const VIEWS = {
  store: [[-16, 1.6, 30], [2, 2.4, 9]],
  lot: [[34, 22, 48], [2, 0, 12]],
  glass: [[-4.5, 1.6, 15.5], [-2, 1.5, 9.5]],
  clerk: [[A.clerkEye[0], A.clerkEye[1], A.clerkEye[2]], [A.clerkEye[0] - 1.5, 1.4, 30]],
  shelter: [[33.2, 1.6, 37.6], [30, 1.3, 33.4]],
  houses: [[-12, 3.5, 12], [-34, 2, -6]],
  night: [[-14, 1.6, 28], [2, 2.4, 9]],
};
const controls = new OrbitControls(cam, renderer.domElement);
function setView(v) { const [p, t] = VIEWS[v] || VIEWS.store; cam.position.set(...p); controls.target.set(...t); controls.update(); renderer.render(scene, cam); }
window.__setView = setView;
setView(view);
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); renderer.render(scene, cam); });
controls.addEventListener('change', () => renderer.render(scene, cam));
requestAnimationFrame(() => { renderer.render(scene, cam); requestAnimationFrame(() => { window.__ready = true; }); });
</script>
</body>
</html>
