<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sky Probe</title>
<style>html,body{margin:0;background:#000;overflow:hidden}#info{position:fixed;left:8px;bottom:6px;color:#fff;font:12px system-ui;background:#0008;padding:2px 6px;border-radius:3px}</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
</head><body><div id="info">loading…</div>
<script type="module">
// Lighting / sky / ground / glass probe with the viewer's exact pipeline (assets.js environment + groundPlane + render_quality).
// ?view=witB|road|sky  ?exposure=  ?ground=grass|pasture  ?quality=render
import * as THREE from 'three';
import { loadAssets } from './assets.js';
import { applyRenderQuality } from './render_quality.js';
const q = new URLSearchParams(location.search);
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9ec9ec);
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(-100, 120, 0); scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xffffff, 0x777766, 0.8); scene.add(hemi);
const assets = await loadAssets(THREE, {});
assets.beginWorld && assets.beginWorld();
const root = new THREE.Group(); scene.add(root);
const env = assets.environment({ date: '2016-05-07', timeOfDay: '16:36', utcOffset: '-04:00', timeZone: 'America/New_York', lat: 29.4106, lon: -82.53979, lighting: 'day', weather: 'clear' });
root.add(env);
// ?skyk= is applied by render_quality.js (tuneSky)
let fog = null;
env.traverse(o => { if (o.userData?.isEnvironment && o.userData.sky) { const sk = o.userData.sky; if (sk.fog) fog = sk.fog; if (sk.background?.isColor && !sk.skyMesh) scene.background = sk.background; } });
if (fog) scene.fog = fog.isFog || fog.isFogExp2 ? fog : null;
hemi.visible = false;
root.add(assets.groundPlane({ id: 'ground', size: 1400, kind: q.get('ground') || 'grass' }));
const rd = assets.road({ id: 'road_eb', lanes: 2, laneWidth: 3.66, length: 1200, markings: 'center_dashed', edgeLines: true, shoulder: 1.52 }); rd.position.z = 0; root.add(rd);
const sh = assets.shelter({ id: 'occ_shelter', open: false }); sh.position.set(8, 0, 8); root.add(sh);
const veh = assets.vehicle ? assets.vehicle({ id: 'veh', type: 'sedan', color: 'navy' }) : null; if (veh) { veh.position.set(-6, 0, 1.8); veh.rotation.y = -Math.PI / 2; root.add(veh); }
const tr = assets.tree({ id: 't1', kind: 'pine', height: 18 }); tr.position.set(-20, 0, 30); root.add(tr);
const cam = new THREE.PerspectiveCamera(60, W / H, 0.1, 2000);
const view = q.get('view') || 'witB';
if (view === 'witB') { cam.position.set(8, 1.56, 9.6); cam.lookAt(-20, 1.5, 0); }
else if (view === 'sky') { cam.position.set(0, 1.6, 20); cam.lookAt(0, 30, -60); }
else { cam.position.set(30, 1.6, 6); cam.lookAt(-30, 1.2, 0); }
const rq = applyRenderQuality(renderer, scene, { quality: q.get('quality') || 'interactive', lighting: 'day', sun, roi: new THREE.Box3(new THREE.Vector3(-60, 0, -40), new THREE.Vector3(60, 8, 40)), exposure: q.get('exposure') ?? undefined });
await rq.ready;
const render = () => (rq.render ? rq.render(cam) : renderer.render(scene, cam));
render(); render();
document.getElementById('info').textContent = `${view} · exposure ${renderer.toneMappingExposure} · env ${rq.envKind}`;
window.__ready = true;
</script></body></html>
