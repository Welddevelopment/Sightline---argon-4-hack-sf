<!doctype html>
<html lang="en" class="clean film">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sightline film</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="overlays.css">
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
<script>
  // Same bootstrap as index.html: window.sl exists before viewer.js runs so callers can await sl.ready.
  (function () {
    window.sl = { ready: new Promise(function (a, b) { window.__slResolve = a; window.__slReject = b; }) };
    window.sl.ready.catch(function () {});
  })();
</script>
<style>
  /* Shot rig page (owner: SHOT RIG). Full-bleed 3D stage + film chrome. Viewer HUD bits that would describe the viewer's own camera are hidden. */
  html.film, html.film body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  html.film #stage { position: fixed; inset: 0; --sans: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  html.film .sl-hud, html.film .sl-eye, html.film .slo-toggle { display: none !important; }
  html.film .sl-kin { z-index: 6; }
  html.film body.nohud .slo-layer { display: none; }
  /* overlays.js live clock panel moves under the plan's HUD box */
  html.film #stage .slo-layer > .slo-panel { top: calc(var(--film-hud-h, 0px) + 1.1vw) !important; left: 1.4vw !important; }
  html.film .sl-banner { top: auto !important; bottom: calc(18px + 7.2vw); font-size: 1.15vw; padding: .55vw 1.4vw; }
  #film-img { position: absolute; z-index: 2; pointer-events: none; opacity: 0; max-width: none; }
  #film-title { position: absolute; inset: 0; z-index: 21; display: none; align-items: center; justify-content: center; background: #000; color: #fff; font-family: var(--sans); --fs: 40px; }
  #film-title .card { max-width: 78vw; text-align: center; }
  #film-title .l1 { font-weight: 700; font-size: var(--fs); line-height: 1.12; letter-spacing: .02em; }
  #film-title .rule { width: calc(var(--fs) * 2.2); height: 2px; background: #e2b052; margin: calc(var(--fs) * .38) auto calc(var(--fs) * .34); }
  #film-title .l2 { font-weight: 400; font-size: calc(var(--fs) * .5); line-height: 1.45; color: #e6e9ee; letter-spacing: .02em; }
  #film-title .l3 { margin-top: calc(var(--fs) * .4); font-size: calc(var(--fs) * .36); color: #8a929e; letter-spacing: .04em; }
  #film-title .q { margin-top: calc(var(--fs) * .25); font-weight: 400; font-style: italic; font-size: calc(var(--fs) * .48); color: #f2f4f7; line-height: 1.4; }
  #film-title .kick { margin-top: calc(var(--fs) * .32); font-weight: 700; font-size: calc(var(--fs) * .36); letter-spacing: .16em; color: #e2b052; text-transform: uppercase; }
  #film-title .sp { height: calc(var(--fs) * .45); }
  #film-title ul { list-style: none; margin: 0 auto; padding: 0; text-align: left; display: inline-block; }
  #film-title li { font-size: calc(var(--fs) * .4); line-height: 1.55; color: #d9dde3; padding-left: 1.2em; position: relative; }
  #film-title li::before { content: ""; position: absolute; left: 0; top: .62em; width: .42em; height: 2px; background: #e2b052; }
  #film-hud { position: absolute; left: 1.4vw; top: 1.2vw; z-index: 7; display: none; pointer-events: none; }
  #film-hud .box { background: rgba(10, 18, 22, .84); border-left: 3px solid #e2b052; padding: .5vw .8vw; font: 500 .86vw/1.5 var(--mono); color: #e8ecf2; max-width: 44vw; }
  #film-hud .box .h { font-weight: 700; color: #fff; letter-spacing: .04em; }
  #film-lt { position: absolute; left: 1.4vw; bottom: calc(18px + 1.5vw); z-index: 7; display: none; max-width: 64vw; font-family: var(--sans); color: #fff; pointer-events: none; }
  #film-lt .row { background: rgba(10, 18, 22, .86); border-left: 3px solid #e2b052; }
  #film-lt.alert .row { background: rgba(150, 22, 22, .9); border-left-color: #ff8a8a; }
  #film-lt .tx { padding: .6vw 1.1vw .65vw; }
  #film-lt .tt { font-weight: 700; font-size: 1.1vw; letter-spacing: .14em; text-transform: uppercase; }
  #film-lt .cp { margin-top: .25vw; font-weight: 400; font-size: 1.02vw; color: #dde1e7; line-height: 1.35; }
  #film-lt .tx > .cp:first-child { margin-top: 0; font-size: 1.08vw; color: #fff; }
  #film-tr { position: absolute; right: 1.4vw; top: 1.2vw; z-index: 7; display: none; text-align: right; pointer-events: none; font: 700 .82vw/1.4 var(--mono); color: #e8ecf2; }
  #film-tr .pb { display: inline-block; padding: .3vw .65vw; background: rgba(10,18,22,.84); letter-spacing: .08em; border: 1px solid rgba(255,255,255,.16); }
  #film-tr .pb.frz { color: #ff9f8a; border-color: #ff6b5a; } #film-tr .pb.held { color: #e2b052; border-color: rgba(226,176,82,.6); }
  #film-tr .na { margin-top: .5vw; }
  #film-tr .na svg { filter: drop-shadow(0 1px 2px rgba(0,0,0,.7)); }
  #film-tr .na text { font: 700 11px var(--sans); fill: #fff; }
  #film-wm { position: absolute; right: 1.4vw; bottom: calc(18px + .9vw); z-index: 22; display: none; pointer-events: none; font: 600 .78vw/1 var(--sans); letter-spacing: .14em; color: rgba(235,238,242,.82); text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  #film-labels { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
  #film-labels .lb { position: absolute; transform: translate(-50%, calc(-100% - 6px)); }
  #film-labels .lb .tx { background: rgba(0,0,0,.74); border-top: 2px solid var(--c); padding: .25vw .5vw .3vw; font: 500 .78vw/1.3 var(--sans); color: #e8ecf2; white-space: nowrap; text-align: center; }
  #film-labels .lb .tx b { display: block; color: var(--c); font-weight: 700; }
  #film-labels .lb .tx span { display: block; }
  #film-labels .lb.mk .tx { border-top-width: 3px; }
  #film-labels .ld { position: absolute; overflow: visible; }
  #film-labels .ld line { stroke-width: 1.2; opacity: .85; }
  #film-scale { position: absolute; right: 1.4vw; bottom: calc(18px + 3.2vw); z-index: 7; display: none; pointer-events: none; font: 600 .74vw/1 var(--mono); color: #fff; text-align: right; text-shadow: 0 1px 2px #000; }
  #film-scale .bar { height: 6px; border: 2px solid #fff; border-top: 0; margin-left: auto; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,.6); background: repeating-linear-gradient(90deg, rgba(255,255,255,.9) 0 25%, transparent 25% 50%); }
  #film-scale .lab { margin-top: .3vw; }
  #film-banner { position: absolute; left: 50%; bottom: calc(18px + 7.2vw); transform: translateX(-50%); z-index: 7; display: none; padding: .55vw 1.4vw; font: 800 1.15vw/1.1 var(--sans); letter-spacing: .06em; color: #fff; }
  #film-banner.ok { background: rgba(20,120,70,.92); border: 2px solid #6ff0a8; } #film-banner.bad { background: rgba(190,30,30,.92); border: 2px solid #ff8a8a; }
  #film-credit { position: absolute; left: 1.4vw; top: calc(var(--film-hud-h, 0px) + 1.2vw); z-index: 7; display: none; pointer-events: none; font: 500 .74vw/1 var(--sans); color: rgba(255,255,255,.88); background: rgba(0,0,0,.55); padding: .3vw .55vw; letter-spacing: .03em; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="film.js"></script>
</body>
</html>
