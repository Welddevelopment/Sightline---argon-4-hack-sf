<!doctype html>
<html lang="en" class="clean film">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sightline film</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="overlays.css">
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
<script>
  // Same bootstrap as index.html: window.sl exists before viewer.js runs so callers can await sl.ready.
  (function () {
    window.sl = { ready: new Promise(function (a, b) { window.__slResolve = a; window.__slReject = b; }) };
    window.sl.ready.catch(function () {});
  })();
</script>
<style>
  /* Shot rig page (owner: SHOT RIG). Full-bleed 3D stage + film chrome; viewer HUD bits that would lie about our camera are hidden. */
  html.film, html.film body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  html.film #stage { position: fixed; inset: 0; }
  html.film .sl-hud, html.film .sl-eye, html.film .slo-toggle { display: none !important; }
  html.film .sl-kin { z-index: 6; }
  html.film body.nohud .slo-layer { display: none; }
  #film-aerial { position: absolute; z-index: 2; pointer-events: none; opacity: 0; object-fit: fill; }
  #film-black { position: absolute; inset: 0; z-index: 20; background: #000; opacity: 0; pointer-events: none; }
  #film-title { position: absolute; inset: 0; z-index: 21; display: none; flex-direction: column; align-items: center; justify-content: center;
    background: #000; color: #fff; font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif; text-align: center; padding: 0 9%; }
  #film-title .l1 { font-weight: 300; font-size: 3.1vw; line-height: 1.2; letter-spacing: .01em; }
  #film-title .l2 { margin-top: 1.4vw; font-weight: 400; font-size: 1.45vw; letter-spacing: .14em; text-transform: uppercase; color: #c9ced6; }
  #film-title .l3 { margin-top: 2.6vw; font-weight: 400; font-size: 1.05vw; letter-spacing: .06em; color: #8a929e; max-width: 70vw; line-height: 1.5; }
  #film-title .rule { width: 6vw; height: 2px; background: #e2b052; margin: 1.6vw auto 0; }
  /* lower third: shot number + title + caption (above the kinematic disclaimer bar) */
  #film-lt { position: absolute; left: 2.2vw; bottom: calc(18px + 1.9vw); z-index: 7; display: none; max-width: 62vw;
    font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif; color: #fff; pointer-events: none; }
  #film-lt .row { display: flex; align-items: stretch; background: rgba(6, 9, 13, .82); border-left: 3px solid #e2b052; }
  #film-lt .no { font: 700 1.25vw/1 ui-monospace, Menlo, Consolas, monospace; padding: .75vw .9vw; color: #e2b052; border-right: 1px solid rgba(255,255,255,.12); display: flex; align-items: center; }
  #film-lt .tx { padding: .6vw 1.1vw .65vw; }
  #film-lt .tt { font-weight: 700; font-size: 1.12vw; letter-spacing: .16em; text-transform: uppercase; }
  #film-lt .cp { margin-top: .3vw; font-weight: 400; font-size: 1.02vw; color: #d5dae2; line-height: 1.35; white-space: normal; }
  /* top-right: simulated badge + scene clock of the shot */
  #film-tr { position: absolute; right: 1.6vw; top: 1.4vw; z-index: 7; display: none; text-align: right; pointer-events: none;
    font: 600 .82vw/1.5 ui-monospace, Menlo, Consolas, monospace; color: #e8ecf2; }
  #film-tr .b { display: inline-block; padding: .25vw .6vw; background: rgba(6,9,13,.78); border: 1px solid rgba(255,255,255,.18); letter-spacing: .1em; color: #b9c2d0; }
  #film-tr .m { display: inline-block; margin-top: .4vw; padding: .25vw .6vw; background: rgba(6,9,13,.78); color: #e2b052; letter-spacing: .06em; }
  #film-stamp { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 8; display: none; pointer-events: none;
    font: 800 2.2vw/1 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .3em; color: #fff; padding: .8vw 1.6vw .8vw 1.9vw;
    background: rgba(160, 24, 24, .86); border: 2px solid #ff8a8a; }
  #film-stamp.freeze { background: rgba(6,9,13,.82); border-color: #e2b052; color: #e2b052; font-size: 1.5vw; top: 22%; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="film.js"></script>
</body>
</html>
